[build]
  command = "npm run build:client"
  functions = "netlify/functions"
  publish = "dist/spa"


[functions]
  external_node_modules = ["express", "@google-analytics/data", "google-auth-library"]
  node_bundler = "esbuild"

# This repo uses ESM (`"type": "module"` in package.json). Ensure the Functions bundle
# is emitted as ESM too, otherwise Netlify will generate CommonJS (`module.exports`)
# which crashes at runtime with: "module is not defined in ES module scope".
[functions.esbuild]
  format = "esm"
  
[[redirects]]
  force = true
  from = "/api/*"
  status = 200
  to = "/.netlify/functions/api/:splat"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
